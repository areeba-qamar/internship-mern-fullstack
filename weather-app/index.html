<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title> Weather app</title>

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<main class="weather-container">
    <h1>🌤 Weather App</h1>

<!-- Search Section -->
    <section class="search-section">

      <form id="weather-form">

        <input
          type="text"
          id="city-input"
          placeholder="Enter city name..."
          required
        >

        <button type="submit">
          Search
        </button>
</form>
</section>

<!-- Weather Card -->
    <section class="weather-card">

       <img
      id="weather-icon"
      src="./assets/images/icon-sunny.webp"
      alt="Weather Icon"
    >


     <h2 id="city-name">City</h2>
     <h3 id="temperature">--°C</h3>
     <p id="description">Weather Description</p>

      <div class="weather-details">
        <p><strong>Feels Like:</strong>
           <span id="feels-like">--C</span>
        </p>                                          <!--here strong is make the text bold  -->
        <p><strong>Humidity:</strong> 
          <span id="humidity">--%</span>
        </p>                                          <!--The <span> tag is much like the <div> element, but <div> is a block-level element and <span> is an inline element. In-short its an in-line container make styling easy.-->
        <p><strong>Wind Speed:</strong> 
          <span id="wind-speed">--km/h</span>
        </p>
      </div>
    </section>

</main>

        <script src="./js/script.js"></script>


</body>
</html>
